<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StudyVault - Add PDF Link</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1313ec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101022",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>body {
    font-family: "Lexend", sans-serif;
    -webkit-tap-highlight-color: transparent
    }
.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
    }
/* Custom Dropdown Arrow */
.custom-select {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuBs5KyfflxLHLoahTmot-qwzxb--2z8Pu2PGafq9F6XAeE0cX8Y4LD9yW8xyx39UR0Y0Bg5CUc9eZqTrAYhSU0jdufc9qyinxvr0gkKR8KbgrUrG6RyNjL89yuAekvNO7Oiw6dIOKXWIGTPjgJv6K0QcCsL5NlkABI-a0l2sU_T8nhfxhx5dABNaue7WngFLBqrMVCPuuk3qonVu1fI0utlmlOTCUhW9ec_ZYXpL6Z3x_LpQBV5CZ_e456JGQLePXyMUlIHVd_96iM);
    background-repeat: no-repeat;
    background-position: right 1rem center;
    background-size: 1.5em;
    appearance: none
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-display">
<!-- Header (TopAppBar) -->
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md px-4 py-4 flex items-center justify-between border-b border-slate-200 dark:border-slate-800">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-white">chevron_left</span>
</button>
<h1 class="text-xl font-bold tracking-tight">Add PDF Link</h1>
</div>
<div class="size-10"></div> <!-- Spacer for centering title if needed, or room for secondary action -->
</header>
<!-- Form Content -->
<main class="flex-1 overflow-y-auto px-4 py-6 space-y-6 max-w-md mx-auto w-full">
<!-- Welcome/Context Section (Optional for better UI flow) -->
<div class="space-y-1">
<h2 class="text-sm font-semibold uppercase tracking-wider text-primary">Import Document</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm">Organize your academic resources by linking directly to online PDF materials.</p>
</div>
<!-- File Name Field -->
<div class="space-y-2">
<label class="block">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">File Name</span>
<div class="mt-1 relative">
<input class="block w-full rounded-xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 py-4 px-4 text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" placeholder="e.g., Organic Chemistry Notes" type="text"/>
</div>
</label>
</div>
<!-- PDF URL Field -->
<div class="space-y-2">
<label class="block">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">PDF URL</span>
<div class="mt-1 relative">
<input class="block w-full rounded-xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 py-4 px-4 text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" placeholder="https://university.edu/lecture1.pdf" type="url"/>
</div>
</label>
<div class="flex items-center gap-2 px-1">
<span class="material-symbols-outlined text-primary text-sm">info</span>
<p class="text-slate-500 dark:text-slate-400 text-xs">Only valid direct PDF links are supported.</p>
</div>
</div>
<!-- Folder Selector -->
<div class="space-y-2">
<label class="block">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Select Folder</span>
<div class="mt-1 relative">
<select class="custom-select block w-full rounded-xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 py-4 px-4 text-slate-900 dark:text-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none">
<option disabled="" selected="" value="">Choose a destination folder</option>
<option value="biology">Biology 101</option>
<option value="calculus">Calculus III</option>
<option value="history">Modern History</option>
<option value="research">Thesis Research</option>
<option value="new">+ Create New Folder</option>
</select>
</div>
</label>
</div>
<!-- Decorative Illustration / Placeholder for Empty State feel -->
<div class="pt-4 flex flex-col items-center justify-center opacity-40 grayscale">
<div class="w-24 h-24 bg-primary/10 rounded-full flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary text-4xl">cloud_upload</span>
</div>
<p class="text-xs text-center px-8">StudyVault will automatically index your PDF for easy searching once saved.</p>
</div>
</main>
<!-- Bottom Action Button -->
<footer class="p-4 bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-slate-800">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
<span>Save to Vault</span>
</button>
<!-- Safe area for mobile -->
<div class="h-4"></div>
</footer>
</body></html>
