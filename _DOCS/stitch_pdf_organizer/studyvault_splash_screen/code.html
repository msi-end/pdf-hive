<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StudyVault Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1313ec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101022",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Lexend', sans-serif;
        }
        .splash-gradient {
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
        }
        .dark .splash-gradient {
            background: linear-gradient(135deg, #101022 0%, #1e1b4b 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark overflow-hidden">
<!-- Main Container representing iOS Phone Form Factor -->
<div class="relative flex h-screen w-full flex-col splash-gradient items-center justify-center p-6">
<!-- Status Bar Spacer (iOS) -->
<div class="absolute top-0 w-full h-12"></div>
<!-- Central Branding Section -->
<div class="flex flex-col items-center justify-center space-y-6">
<!-- App Logo Container -->
<div class="relative w-32 h-32 flex items-center justify-center">
<!-- Outer Folder Icon Shape -->
<div class="absolute inset-0 bg-primary/10 dark:bg-primary/20 rounded-xl"></div>
<!-- Icon Composition -->
<div class="relative flex flex-col items-center">
<span class="material-symbols-outlined text-primary text-[80px]" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;">
                        folder_managed
                    </span>
<!-- Overlaid PDF Indicator -->
<div class="absolute bottom-1 right-1 bg-white dark:bg-background-dark p-1 rounded-lg shadow-sm border border-primary/20">
<span class="material-symbols-outlined text-primary text-[24px]" style="font-variation-settings: 'FILL' 1;">
                            picture_as_pdf
                        </span>
</div>
</div>
</div>
<!-- App Title Component (HeadlineText adapted) -->
<div class="text-center">
<h1 class="text-[#0d0d1b] dark:text-white tracking-tight text-[40px] font-bold leading-tight font-display">
                    StudyVault
                </h1>
<p class="text-[#0d0d1b]/60 dark:text-white/60 text-sm font-medium mt-1 tracking-wide uppercase">
                    Academic Document Manager
                </p>
</div>
</div>
<!-- Loading Section (Bottom-aligned for iOS) -->
<div class="absolute bottom-20 w-full max-w-[280px] px-4">
<div class="flex flex-col gap-3">
<div class="flex justify-center">
<p class="text-[#0d0d1b]/70 dark:text-white/70 text-sm font-medium leading-normal animate-pulse">
                        Organizing your library...
                    </p>
</div>
<!-- ProgressBar Component adapted -->
<div class="rounded-full bg-primary/10 dark:bg-white/10 h-1.5 w-full overflow-hidden">
<div class="h-full rounded-full bg-primary" style="width: 45%;"></div>
</div>
</div>
</div>
<!-- iOS Home Indicator Safe Area -->
<div class="absolute bottom-2 w-32 h-1.5 bg-[#0d0d1b]/20 dark:bg-white/20 rounded-full"></div>
</div>
<!-- Hidden Background Image for Theme Context if needed -->
<div class="hidden">
<div data-alt="Soft blue and purple academic gradient pattern background"></div>
</div>
</body></html>
